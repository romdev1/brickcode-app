<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BrickCode Offline</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
      -webkit-app-region: drag;
    }

    .splash {
      width: 480px;
      padding: 48px 40px 36px;
      background: linear-gradient(145deg, #1a1d2e 0%, #0d1117 100%);
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow:
        0 25px 60px rgba(0, 0, 0, 0.6),
        0 0 0 1px rgba(255, 255, 255, 0.05),
        inset 0 1px 0 rgba(255, 255, 255, 0.06);
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .splash::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(ellipse at 30% 20%, rgba(88, 171, 65, 0.08) 0%, transparent 60%);
      pointer-events: none;
    }

    .logo {
      width: 80px;
      height: 80px;
      margin: 0 auto 20px;
      background: linear-gradient(135deg, #58AB41, #3d8b2f);
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 24px rgba(88, 171, 65, 0.3);
    }

    .logo svg {
      width: 48px;
      height: 48px;
      fill: white;
    }

    h1 {
      color: #e6edf3;
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 4px;
      letter-spacing: -0.3px;
    }

    .subtitle {
      color: #8b949e;
      font-size: 13px;
      margin-bottom: 32px;
    }

    .progress-container {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 3px;
      overflow: hidden;
      margin-bottom: 16px;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #58AB41, #7dd35e);
      border-radius: 3px;
      transition: width 0.3s ease;
    }

    .progress-bar.indeterminate {
      width: 30%;
      animation: slide 1.5s ease-in-out infinite;
    }

    @keyframes slide {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(430%); }
    }

    .status {
      color: #8b949e;
      font-size: 13px;
      min-height: 20px;
      transition: opacity 0.2s;
    }

    .version-badge {
      display: inline-block;
      padding: 2px 10px;
      background: rgba(88, 171, 65, 0.15);
      color: #58AB41;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 500;
      margin-top: 12px;
    }
  </style>
</head>
<body>
  <div class="splash">
    <div class="logo">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
      </svg>
    </div>
    <h1>BrickCode Offline</h1>
    <p class="subtitle">Редактор для LEGO MINDSTORMS EV3 • Приложение: romdev1 • BrickCode: THEB0NNY</p>
    <div class="progress-container">
      <div class="progress-bar indeterminate" id="progressBar"></div>
    </div>
    <p class="status" id="status">Инициализация...</p>
    <div class="version-badge" id="versionBadge">Запуск</div>
  </div>
  <script>
    const bar = document.getElementById('progressBar');
    const status = document.getElementById('status');
    const badge = document.getElementById('versionBadge');

    if (window.brickcode) {
      window.brickcode.onStatus((msg) => {
        status.textContent = msg;
        if (msg.includes('версия') || msg.includes('Версия')) {
          const v = msg.match(/v[\d.]+/);
          if (v) badge.textContent = v[0];
        }
      });

      window.brickcode.onProgress((val) => {
        bar.classList.remove('indeterminate');
        bar.style.width = val + '%';
        badge.textContent = val + '%';
      });
    }
  </script>
</body>
</html>
